[project]
name = "sp-rtk-portal"
version = "0.1.0"
description = "Hosted Portal for reaching sp-rtk-base base stations remotely"
readme = "README.md"
authors = [{ name = "John Roden", email = "rodenj@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "sp-rtk-portal-protocol",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
sp-rtk-portal = "sp_rtk_portal.main:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["protocol"]

[tool.uv.sources]
sp-rtk-portal-protocol = { workspace = true }

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "pgserver>=0.1.4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI route handlers use `Depends(...)` defaults.
"src/sp_rtk_portal/**/routes.py" = ["B008"]
