{% extends "base.html" %}
{% block head %}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{% endblock %}
{% block main %}
<section class="card">
  <h1>Reset your password</h1>
  <p>We'll email you a link to choose a new password.</p>
  <form data-action="/recover" data-step="recover">
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    {% include "_turnstile.html" %}
    <button type="submit">Send link</button>
  </form>
  <p class="error" data-error role="alert" hidden></p>
  <p class="links"><a href="/login">Back to sign in</a></p>
</section>
{% endblock %}
