{% extends "base.html" %}
{% block main %}
<section class="card">
  <h1>Turn on two-step sign-in</h1>
  <p>Scan this code with your authenticator app, or type in the key below.</p>
  <div class="qr">{{ qr_svg | safe }}</div>
  <p>Key: <code class="secret">{{ secret }}</code></p>
  <form data-action="/account/totp/confirm" data-step="confirm">
    <label>Code from the app
      <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" required>
    </label>
    <button type="submit">Turn on</button>
  </form>
  <p class="error" data-error role="alert" hidden></p>
  <p class="links"><a href="/account">Cancel</a></p>
</section>
{% endblock %}
