{% extends "base.html" %}
{% block main %}
<section class="card">
  <h1>Choose a new password</h1>
  <form data-action="/reset" data-step="password">
    <input type="hidden" name="t" value="{{ token }}">
    <label>New password <input name="password" type="password" autocomplete="new-password" required></label>
    <label>New password again <input name="password_repeat" type="password" autocomplete="new-password" required></label>
    <button type="submit">Set password</button>
  </form>
  <form data-action="/reset/totp" data-step="totp" hidden>
    <label>Authenticator code
      <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" required>
    </label>
    <button type="submit">Verify</button>
  </form>
  <p class="error" data-error role="alert" hidden></p>
</section>
{% endblock %}
