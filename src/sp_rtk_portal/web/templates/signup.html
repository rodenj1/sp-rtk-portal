{% extends "base.html" %}
{% block head %}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{% endblock %}
{% block main %}
<section class="card">
  <h1>Create an account</h1>
  <form data-action="/signup" data-step="signup">
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    <label>Password <input name="password" type="password" autocomplete="new-password" required></label>
    <label>Password again <input name="password_repeat" type="password" autocomplete="new-password" required></label>
    {% include "_turnstile.html" %}
    <button type="submit">Create account</button>
  </form>
  <p class="error" data-error role="alert" hidden></p>
  <p class="links">Already have an account? <a href="/login">Sign in</a></p>
</section>
{% endblock %}
