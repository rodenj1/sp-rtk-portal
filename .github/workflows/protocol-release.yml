# Publish the protocol package (protocol/) to PyPI as sp-rtk-portal-protocol
# when a protocol tag is pushed:
#
#   git tag protocol-v0.9.0 && git push origin protocol-v0.9.0
#
# The tag's version must equal protocol/pyproject.toml's. These tags don't
# match image.yml's "v*", so a protocol release never builds a Portal image
# (and a Portal tag never publishes the protocol).
#
# Authentication is PyPI Trusted Publishing (OIDC), no API token. A pending
# publisher must be registered on pypi.org once before the first release:
# see "Releasing" in protocol/README.md.
#
# Pipeline (mirrors sp-rtk-base's release.yml):
#   1. verify-version  fail if the tag != protocol/pyproject.toml version
#   2. test (matrix)   protocol tests on Python 3.10 to 3.13
#   3. build           uv build + twine check; upload dist/ artifact
#   4. publish-pypi    pypa/gh-action-pypi-publish via OIDC
name: protocol-release

on:
  push:
    tags: ["protocol-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. protocol-v0.9.0"
        required: true
        type: string

# One release at a time per tag. Never cancel in progress: a partial upload
# to PyPI can't be retried under the same version.
concurrency:
  group: protocol-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify tag matches protocol version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.pyproject_version }}
      tag: ${{ steps.versions.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag and pyproject version
        id: versions
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ "$tag" != protocol-v* ]]; then
            echo "::error::'$tag' is not a protocol tag (protocol-v<version>)."
            exit 1
          fi
          tag_version="${tag#protocol-v}"

          pyproject_version="$(
            python3 -c '
          import tomllib
          with open("protocol/pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          '
          )"

          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "pyproject_version=$pyproject_version" >>"$GITHUB_OUTPUT"
          echo "Tag:               $tag (version: $tag_version)"
          echo "pyproject version: $pyproject_version"

          if [[ "$tag_version" != "$pyproject_version" ]]; then
            echo "::error::Tag '$tag' (version '$tag_version') does not match protocol/pyproject.toml version '$pyproject_version'. Bump the version or retag."
            exit 1
          fi

  # The package alone, as a consumer installs it: no workspace, no Portal.
  # sp-rtk-base still supports Python 3.10, so the package must too.
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: protocol
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify-version.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"

      - name: Run the protocol tests
        run: >
          uv run --isolated --no-project
          --python ${{ matrix.python-version }}
          --with .
          --with "pytest>=8.3"
          --with "pytest-asyncio>=0.24"
          pytest tests

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [verify-version, test]
    defaults:
      run:
        working-directory: protocol
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify-version.outputs.tag }}

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build --no-sources --out-dir dist

      - name: List built artifacts
        run: ls -la dist/

      - name: Validate distribution with twine
        run: uvx twine check --strict dist/*

      - name: Confirm version in built artifacts
        env:
          EXPECTED: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ok=0
          for f in dist/*.tar.gz dist/*.whl; do
            case "$f" in
              dist/sp_rtk_portal_protocol-"${EXPECTED}".tar.gz|dist/sp_rtk_portal_protocol-"${EXPECTED}"-*.whl)
                echo "OK: $f"
                ok=1
                ;;
              *)
                echo "::error::Unexpected artifact $f (expected sp_rtk_portal_protocol ${EXPECTED})"
                exit 1
                ;;
            esac
          done
          if [[ "$ok" -eq 0 ]]; then
            echo "::error::No artifacts found in dist/"
            exit 1
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: protocol/dist/
          retention-days: 30
          if-no-files-found: error

  # The `pypi` environment must exist in this repo's settings, and PyPI must
  # have a trusted publisher for (rodenj1/sp-rtk-portal, protocol-release.yml,
  # environment: pypi).
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [verify-version, build]
    environment:
      name: pypi
      url: https://pypi.org/project/sp-rtk-portal-protocol/${{ needs.verify-version.outputs.version }}/
    permissions:
      id-token: write # required for OIDC trusted publishing
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # No `with:` block: authentication is automatic via OIDC.
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
