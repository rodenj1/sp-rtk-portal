[project]
name = "sp-rtk-portal-protocol"
version = "0.9.0"
description = "Agent-to-Portal protocol shared by sp-rtk-portal and sp-rtk-base's Portal agent"
readme = "README.md"
authors = [{ name = "John Roden", email = "rodenj@gmail.com" }]
license = "MIT"
# sp-rtk-base supports Python 3.10, so this package must too.
requires-python = ">=3.10"
keywords = ["rtk", "gnss", "base-station", "dpop", "jws", "ed25519", "tunnel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/rodenj1/sp-rtk-portal/tree/main/protocol"
Repository = "https://github.com/rodenj1/sp-rtk-portal"
Issues = "https://github.com/rodenj1/sp-rtk-portal/issues"
"Used by" = "https://github.com/rodenj1/sp-rtk-base"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
# sp-rtk-base still runs on Python 3.10.
target-version = "py310"
