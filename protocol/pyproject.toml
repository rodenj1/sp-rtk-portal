[project]
name = "sp-rtk-portal-protocol"
version = "0.8.0"
description = "Agent-to-Portal protocol shared by sp-rtk-portal and sp-rtk-base's Portal agent"
readme = "README.md"
authors = [{ name = "John Roden", email = "rodenj@gmail.com" }]
license = { text = "MIT" }
# sp-rtk-base supports Python 3.10, so this package must too.
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
# sp-rtk-base still runs on Python 3.10.
target-version = "py310"
